spring:
  application:
    name: nexus-api
  messages:
    encoding: UTF-8

  datasource:
    url: jdbc:postgresql://localhost:5432/nexus_db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true


api:
  security:
    token:
      secret: ${JWT_SECRET:development-key}